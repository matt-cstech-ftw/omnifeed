<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OmniFeed Live Multi-Stream HUD">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OmniFeed">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OmniFeed HUD</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0F0F13;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #loading-container {
      position: fixed;
      inset: 0;
      background-color: #0F0F13;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 999999;
      transition: opacity 0.3s ease-out;
    }
    .brand {
      font-weight: 900;
      font-size: 26px;
      color: #FFFFFF;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .brand-accent {
      color: #00E5FF;
    }
    .status-msg {
      color: #00E5FF;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }
    .sub-msg {
      color: #888899;
      font-size: 11px;
    }
    .spinner {
      margin-top: 16px;
      width: 24px;
      height: 24px;
      border: 2px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00E5FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="brand">OMNI<span class="brand-accent">FEED</span></div>
    <div class="status-msg">OmniFeed is loading, please wait a moment...</div>
    <div class="sub-msg">Loading real-time stream HUD components</div>
    <div class="spinner"></div>
  </div>

  <script>
    function removeLoader() {
      const loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 300);
      }
    }

    window.addEventListener('flutter-first-frame', removeLoader);

    // Fallback: remove after max timeout if event was missed
    setTimeout(removeLoader, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
